<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>街头中文 Flashcards</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="街头中文">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181c1d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --paper:#f4f2ea; --card:#fbfaf5; --ink:#22282a; --ink-soft:#4d5658; --muted:#7c8486; --line:#e2ddce;
    --jade:#2f7d6b; --jade-soft:#e2efe9; --seal:#c0503e; --seal-soft:#f6e4de; --gold:#b98a2e;
    --shadow:0 1px 2px rgba(34,40,42,.05),0 8px 24px rgba(34,40,42,.07);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --han:"PingFang SC","Hiragino Sans GB","Songti SC","Noto Sans CJK SC",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{--paper:#181c1d; --card:#232a2b; --ink:#eef1ee; --ink-soft:#c2cac9; --muted:#8b9492; --line:#333c3d;
      --jade:#5fbfa8; --jade-soft:#1e2f2b; --seal:#e07a68; --seal-soft:#33221e; --gold:#d6ab5a;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  body{padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto}
  [hidden]{display:none!important}

  /* ---- home ---- */
  .mast{padding:22px 0 14px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--jade);font-weight:600}
  h1{font-size:28px;line-height:1.15;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em}
  h1 .cn{font-family:var(--han)}
  .sub{color:var(--ink-soft);font-size:14.5px;margin:0}
  .mixall{width:100%;margin:16px 0 4px;background:var(--jade);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:600;font-size:16px}
  .wk{margin-top:22px}
  .wk-h{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
  .wk-h .b{white-space:nowrap;flex:0 0 auto;font-family:var(--han);font-size:13px;font-weight:600;color:#fff;background:var(--jade);border-radius:7px;padding:2px 7px}
  .wk-h .t{font-weight:600;font-size:16px}
  .wk-h .all{white-space:nowrap;flex:0 0 auto;margin-left:auto;background:none;border:0;color:var(--jade);font-size:14px;font-weight:600;padding:4px 0}
  .deck-r{display:flex;gap:8px;margin-bottom:8px}
  .deck-r .deck{margin-bottom:0;flex:1;min-width:0}
  .lbtn{flex:0 0 auto;width:64px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);color:var(--jade);font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
  .lbtn b{font-size:18px;line-height:1}
  .deck{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
  .deck:active{transform:scale(.99)}
  .deck .nm{font-weight:600;font-size:15.5px}
  .deck .ct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .deck .bar{height:4px;border-radius:4px;background:var(--line);margin-top:7px;overflow:hidden}
  .deck .bar i{display:block;height:100%;background:var(--jade);border-radius:4px}
  .deck .go{margin-left:auto;color:var(--muted);font-size:20px}
  .deck .body{flex:1;min-width:0}
  .foot{color:var(--muted);font-size:12.5px;text-align:center;margin:28px 0 24px;line-height:1.6}
  .foot button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:12.5px}

  /* ---- study ---- */
  .top{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
  .back{background:var(--card);border:1px solid var(--line);border-radius:11px;width:40px;height:40px;font-size:20px;line-height:1;display:grid;place-items:center}
  .top .ttl{font-weight:600;font-size:15.5px;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top .ttl small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
  .top .pos{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .opts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .opt{font-size:13px;font-weight:600;background:var(--card);color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .opt.on{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
  .fc{height:min(52vh,360px);perspective:1200px;margin-bottom:14px;user-select:none;-webkit-user-select:none}
  .fc-in{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
  .fc.flip .fc-in{transform:rotateY(180deg)}
  .fc.noanim .fc-in{transition:none}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);
    background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
  .back-f{transform:rotateY(180deg);background:var(--jade-soft)}
  .big-h{font-family:var(--han);font-size:clamp(34px,13vw,64px);line-height:1.15;word-break:break-word}
  .big-h.long{font-size:clamp(26px,8.5vw,40px)}
  .big-e{font-size:21px;font-weight:500;line-height:1.35}
  .py{font-family:var(--mono);font-size:18px;color:var(--jade)}
  .en{font-size:16px;color:var(--ink-soft);line-height:1.45;max-width:32ch}
  .h-sm{font-family:var(--han);font-size:30px}
  .hint{position:absolute;bottom:14px;font-size:12px;color:var(--muted)}
  .known-tag{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--jade);
    background:var(--jade-soft);border-radius:6px;padding:2px 7px}
  .act{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .abtn{border-radius:14px;padding:15px 10px;font-weight:600;font-size:16px;border:1px solid var(--line);background:var(--card)}
  .abtn.learn{color:var(--seal);border-color:var(--seal);background:var(--seal-soft)}
  .abtn.know{color:#fff;background:var(--jade);border-color:var(--jade)}
  .sub-act{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
  .lnk{background:none;border:0;color:var(--muted);font-size:14px;padding:8px 4px}
  .say{background:var(--card);border:1px solid var(--line);border-radius:11px;width:44px;height:44px;color:var(--seal);display:grid;place-items:center}
  .say svg{width:18px;height:18px}

  /* ---- list ---- */
  .scan{width:100%;margin:6px 0 4px;background:var(--card);color:var(--jade);border:1px solid var(--jade);border-radius:14px;padding:12px;font-weight:600;font-size:15.5px}
  .lst-sum{font-size:13px;color:var(--muted);margin:0 0 10px;font-variant-numeric:tabular-nums}
  .lst-sec{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin:8px 0 0}
  .lst-sec .sn{flex:1;min-width:0;font-weight:600;font-size:15px}
  .lst-sec .sn small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .lst-sec .ar{color:var(--muted);font-size:18px;transition:transform .2s}
  .lst-sec.open{border-radius:14px 14px 0 0;border-bottom-color:transparent;box-shadow:none}
  .lst-sec.open .ar{transform:rotate(90deg)}
  .lst-sec + .rows{border-radius:0 0 14px 14px;border-top-color:var(--line)}
  .lst-wk{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 2px 2px;font-family:var(--han)}
  .lst-tools{display:flex;justify-content:flex-end;margin:-4px 0 0}
  .rows{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:10px 6px 10px 14px;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .txt{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
  .row .rh{font-family:var(--han);font-size:21px;line-height:1.25}
  .row .rp{font-family:var(--mono);font-size:13px;color:var(--jade);margin-left:8px}
  .row .re{display:block;font-size:13.5px;color:var(--ink-soft);line-height:1.4;margin-top:2px}
  .lst.hideE .row:not(.peek) .re{color:transparent;background:var(--line);border-radius:5px;width:60%;height:1.1em;margin-top:6px;overflow:hidden;white-space:nowrap;user-select:none;-webkit-user-select:none}
  .row.kn .rh{color:var(--muted)}
  .chk{flex:0 0 auto;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0}
  .chk i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:700;color:transparent;transition:background .15s,border-color .15s}
  .row.kn .chk i{background:var(--jade);border-color:var(--jade);color:#fff}
  .lst-empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14.5px}

  /* ---- done ---- */
  .done{text-align:center;padding:48px 16px}
  .done .big{font-family:var(--han);font-size:54px;color:var(--jade)}
  .done h2{margin:8px 0 6px;font-size:22px}
  .done p{color:var(--ink-soft);margin:0 0 22px}
  .done .abtn{width:100%;margin-bottom:10px}
  @media (prefers-reduced-motion:reduce){.fc-in{transition:none}}
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME -->
  <main id="home">
    <header class="mast">
      <div class="eyebrow">街头中文 · Street Mandarin</div>
      <h1><span class="cn">抽认卡</span> Flashcards</h1>
      <p class="sub" id="homeSub"></p>
    </header>
    <button class="mixall" id="mixAll">Study everything I'm still learning</button>
    <button class="scan" id="scanAll">☰ Scan all vocab as a list</button>
    <div id="weeks"></div>
    <p class="foot">Works offline once opened. Progress is saved on this device.<br>
      <button id="resetBtn">Reset progress</button></p>
  </main>

  <!-- STUDY -->
  <main id="study" hidden>
    <div class="top">
      <button class="back" id="backBtn" aria-label="Back to decks">‹</button>
      <div class="ttl" id="sTitle"></div>
      <div class="pos" id="sPos"></div>
    </div>
    <div class="opts">
      <button class="opt" id="optDir"></button>
      <button class="opt" id="optShuf">Shuffle</button>
      <button class="opt" id="optKnown"></button>
      <button class="opt" id="optList">☰ List</button>
    </div>
    <div class="fc" id="card">
      <div class="fc-in">
        <div class="face front-f" id="front"></div>
        <div class="face back-f" id="backF"></div>
      </div>
    </div>
    <div class="act">
      <button class="abtn learn" id="learnBtn">Still learning</button>
      <button class="abtn know" id="knowBtn">✓ Know it</button>
    </div>
    <div class="sub-act">
      <button class="lnk" id="prevBtn">‹ Previous</button>
      <button class="say" id="sayBtn" aria-label="Say it"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg></button>
      <button class="lnk" id="skipBtn">Skip ›</button>
    </div>
  </main>

  <!-- LIST -->
  <main id="list" hidden>
    <div class="top">
      <button class="back" id="lBack" aria-label="Back">‹</button>
      <div class="ttl" id="lTitle"></div>
    </div>
    <div class="opts">
      <button class="opt" data-f="all">All</button>
      <button class="opt" data-f="learn">Still learning</button>
      <button class="opt" data-f="known">Known</button>
      <button class="opt" id="optHideE">Hide meaning</button>
    </div>
    <p class="lst-sum" id="lSum"></p>
    <div class="lst-tools" id="lTools"><button class="lnk" id="lToggleAll">Expand all</button></div>
    <div class="lst" id="lBody"></div>
  </main>

  <!-- DONE -->
  <main id="done" hidden>
    <div class="done">
      <div class="big">好！</div>
      <h2 id="dTitle"></h2>
      <p id="dSub"></p>
      <button class="abtn know" id="againBtn">Go again with the ones I missed</button>
      <button class="abtn" id="homeBtn">Back to decks</button>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";
  var DATA = {"weeks":[{"n":1,"badge":"第一周","title":"Getting around"},{"n":2,"badge":"第二周","title":"Eating"},{"n":3,"badge":"第三周","title":"Bargaining & when things go wrong"},{"n":4,"badge":"第四周","title":"Talking with people"}],"decks":[{"id":"w1v","week":1,"name":"Key vocabulary","cards":[{"h":"师傅","p":"shīfu","e":"n · how you address any driver or tradesman — never 司机"},{"h":"麻烦您了","p":"máfan nín le","e":"phr · \"sorry to trouble you\" — softens any request"},{"h":"系好安全带","p":"jì hǎo ānquándài","e":"phr · buckle up (系 jì = to fasten)"},{"h":"堵","p":"dǔ","e":"adj · jammed, congested (堵车 = a traffic jam)"},{"h":"赶时间","p":"gǎn shíjiān","e":"phr · to be in a hurry, racing the clock"},{"h":"估计","p":"gūjì","e":"v · I reckon / I'd estimate"},{"h":"绕远","p":"rào yuǎn","e":"v · to go the long way round"},{"h":"没事","p":"méishì","e":"phr · no problem, doesn't matter"},{"h":"导航","p":"dǎoháng","e":"n · GPS navigation"},{"h":"坐稳","p":"zuò wěn","e":"v · sit tight, hold on"},{"h":"扫码","p":"sǎomǎ","e":"v · to scan the QR code"},{"h":"支付宝","p":"Zhīfùbǎo","e":"n · Alipay (微信 = WeChat, the other one)"},{"h":"微信","p":"Wēixìn","e":"n · WeChat (messaging + payments + everything)"},{"h":"发票","p":"fāpiào","e":"n · official printed receipt (carries the cab number)"},{"h":"号线","p":"hào xiàn","e":"n · line number (八号线 = Line 8)"},{"h":"往","p":"wǎng","e":"prep · toward, heading — 往南 southbound"},{"h":"换乘","p":"huànchéng","e":"v · to transfer between lines"},{"h":"直达","p":"zhídá","e":"v · direct, no change"},{"h":"出站","p":"chū zhàn","e":"v · to exit the station"},{"h":"刷","p":"shuā","e":"v · to tap or scan (a card, a phone)"},{"h":"二维码","p":"èrwéimǎ","e":"n · QR code"},{"h":"明白","p":"míngbai","e":"v · to understand, to get it"},{"h":"拐","p":"guǎi","e":"v · to turn (a corner) — 往东拐 turn east"},{"h":"路口","p":"lùkǒu","e":"n · intersection, junction"},{"h":"不好意思","p":"bù hǎoyìsi","e":"phr · excuse me / sorry to bother — NOT 对不起"},{"h":"顺着","p":"shùnzhe","e":"prep · along, following (顺着这条路 = along t ":"n · free shipping"},{"h":"赠送","p":"zèngsòng","e":"v · to give free (with a purchase); 赠 = a gift"},{"h":"全场","p":"quánchǎng","e":"n · the whole store / everything (全场9折)"}]},{"id":"w3s","week":3,"name":"Deals & signs","cards":[{"h":"打折","p":"dǎ zhé","e":"on sale / to discount (X折 = you PAY X×10%)"},{"h":"全场9折","p":"quánchǎng jiǔ zhé","e":"10% off everything (pay 90%) (signs often use digits: 9折 = 九折)"},{"h":"全场8折","p":"quánchǎng bā zhé","e":"20% off everything (pay 80%) (the lower the number, the bigger the cut)"},{"h":"第二件半价","p":"dì-èr jiàn bànjià","e":"2nd item half price (≈25% off for two)"},{"h":"满100减30","p":"mǎn yìbǎi jiǎn sānshí","e":"spend 100, take 30 off (满减 = spend-and-save)"},{"h":"买一送一","p":"mǎi yī sòng yī","e":"buy one, get one free (best value — 50% off two)"},{"h":"买二送一","p":"mǎi èr sòng yī","e":"buy two, get one free (≈33% off three)"},{"h":"更有好礼赠送","p":"gèng yǒu hǎolǐ zèngsòng","e":"plus a free gift (gift-with-purchase (赠 = given free))"},{"h":"加10元多一件","p":"jiā shí yuán duō yī jiàn","e":"+10 yuan for one more (add-on deal)"},{"h":"清仓","p":"qīngcāng","e":"clearance — everything must go (often final sale, no returns)"},{"h":"一口价","p":"yìkǒu jià","e":"fixed price — no haggling (don't bother bargaining)"},{"h":"实价","p":"shíjià","e":"the honest price — as marked (shí = real; no bargaining)"},{"h":"时价","p":"shíjià","e":"market price — ask first (same sound as 实价! usually seafood)"},{"h":"特价 / 特惠","p":"tèjià / tèhuì","e":"special low price (a genuine markdown)"},{"h":"会员价","p":"huìyuán jià","e":"members' price (the non-member pays more)"},{"h":"不讲价","p":"bù jiǎngjià","e":"no bargaining (same as 一口价)"},{"h":"即日起","p":"jírì qǐ","e":"effective from today (the sale start)"},{"h":"至10月15日","p":"zhì shíyuè shíwǔ rì","e":"until Oct 15 (至…日 = the end date)"},{"h":"即买即得","p":"jí mǎi jí dé","e":"get it right away with purchase (no voucher/waiting)"},{"h":"送完为止","p":"sòng wán wéizhǐ","e":"while supplies last (until the gifts run out)"},{"h":"买任意一件即赠","p":"mǎi r h":"一路顺风","p":"yílù shùnfēng","e":"phr · safe travels, bon voyage"},{"h":"玩得开心","p":"wán de kāixīn","e":"phr · to have a great time (玩得很开心)"},{"h":"保重","p":"bǎozhòng","e":"v · take care (of yourself) — a warm goodbye"},{"h":"有空","p":"yǒu kòng","e":"phr · to have free time (有空常联系)"},{"h":"还是","p":"háishì","e":"conj · or (inside a question)"},{"h":"一定","p":"yídìng","e":"adv · definitely, for sure"},{"h":"以后","p":"yǐhòu","e":"adv · later, from now on"}]}],"seedKnown":["多久","现金","一共","免费","换","师傅","麻烦您了","堵","赶时间","没事","明白","马上","对了","左右"]};
  var KEY = "sm-flashcards-v1";

  // ---- saved state (per device) ----
  var S = {known:{}, dir:"zh", hideKnown:true, seeded:false};
  try { var raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

  var ALL = [];
  DATA.decks.forEach(function(d){
    d.cards.forEach(function(c){ c.id = d.id + ":" + c.h; c.deck = d; ALL.push(c); });
  });
  if (!S.seeded) {                       // the course page pre-marked these as known
    DATA.decks.filter(function(d){ return d.id === "w1v"; }).forEach(function(d){
      d.cards.forEach(function(c){ if (DATA.seedKnown.indexOf(c.h) >= 0) S.known[c.id] = true; });
    });
    S.seeded = true; save();
  }

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function show(id){ ["home","study","done","list"].forEach(function(x){ $(x).hidden = x !== id; }); window.scrollTo(0,0); }

  // ---- home ----
  function renderHome(){
    var k = ALL.filter(function(c){ return S.known[c.id]; }).length;
    $("homeSub").textContent = ALL.length + " cards · " + k + " known · " + (ALL.length - k) + " still learning";
    var html = "";
    DATA.weeks.forEach(function(w){
      var decks = DATA.decks.filter(function(d){ return d.week === w.n; });
      html += '<section class="wk"><div class="wk-h"><span class="b">' + esc(w.badge) + '</span><span class="t">' + esc(w.title) + '</span>' +
        (decks.length > 1 ? '<button class="all" data-week="' + w.n + '">Whole week ›</button>' : '') + '</div>';
      decks.forEach(function(d){
        var kn = d.cards.filter(function(c){ return S.known[c.id]; }).length;
        html += '<div class="deck-r"><button class="deck" data-deck="' + d.id + '"><div class="body"><div class="nm">' + esc(d.name) + '</div>' +
          '<div class="ct">' + kn + ' / ' + d.cards.length + ' known</div><div class="bar"><i style="width:' + Math.round(100*kn/d.cards.length) + '%"></i></div></div>' +
          '<span class="go">›</span></button><button class="lbtn" data-list="' + d.id + '" aria-label="List ' + esc(d.name) + '"><b>☰</b>List</button></div>';
      });
      html += '</section>';
    });
    $("weeks").innerHTML = html;
  }
  $("weeks").addEventListener("click", function(e){
    var b = e.target.closest("[data-deck],[data-week],[data-list]"); if (!b) return;
    if (b.dataset.list) {
      var ld = DATA.decks.filter(function(x){ return x.id === b.dataset.list; })[0];
      openList(ld.cards, ld.name, "Week " + ld.week, "home");
    } else if (b.dataset.deck) {
      var d = DATA.decks.filter(function(x){ return x.id === b.dataset.deck; })[0];
      start(d.cards, d.name, "Week " + d.week);
    } else {
      var n = +b.dataset.week, w = DATA.weeks[n-1];
      start(ALL.filter(function(c){ return c.deck.week === n; }), "Whole week", w.badge + " · " + w.title);
    }
  });
  $("mixAll").onclick = function(){ start(ALL, "Everything", "All weeks", true); };

  // ---- study session ----
  var pool = [], deck = [], i = 0, flipped = false, title = "", subtitle = "", shuffled = false, missed = [];
  function shuffle(a){ a = a.slice(); for (var j = a.length - 1; j > 0; j--) { var r = Math.floor(Math.random()*(j+1)); var t = a[j]; a[j] = a[r]; a[r] = t; } return a; }
  function rebuild(){
    var base = S.hideKnown ? pool.filter(function(c){ return !S.known[c.id]; }) : pool.slice();
    deck = shuffled ? shuffle(base) : base;
    i = 0;
  }
  function start(cards, t, st, forceShuffle){
    pool = cards; title = t; subtitle = st; missed = [];
    shuffled = !!forceShuffle;
    rebuild();
    if (!deck.length && S.hideKnown) { S.hideKnown = false; save(); rebuild(); }
    show("study"); draw(true);
  }
  function opts(){
    $("optDir").textContent = S.dir === "zh" ? "中文 first" : "English first";
    $("optShuf").classList.toggle("on", shuffled);
    var kn = pool.filter(function(c){ return S.known[c.id]; }).length;
    $("optKnown").textContent = S.hideKnown ? "Show known (" + kn + ")" : "Hide known (" + kn + ")";
    $("optKnown").classList.toggle("on", !S.hideKnown);
  }
  function draw(noanim){
    opts();
    $("sTitle").innerHTML = esc(title) + "<small>" + esc(subtitle) + "</small>";
    if (i >= deck.length) return finish();
    var c = deck[i], long = c.h.length > 6;
    var tag = S.known[c.id] ? '<span class="known-tag">known</span>' : '';
    var hanBig = '<div class="big-h' + (long ? ' long' : '') + '">' + esc(c.h) + '</div>';
    if (S.dir === "zh") {
      $("front").innerHTML = tag + hanBig + '<div class="hint">tap to flip</div>';
      $("backF").innerHTML = tag + '<div class="h-sm">' + esc(c.h) + '</div><div class="py">' + esc(c.p) + '</div><div class="en">' + esc(c.e) + '</div>';
    } else {
      $("front").innerHTML = tag + '<div class="big-e">' + esc(c.e) + '</div><div class="hint">tap to flip</div>';
      $("backF").innerHTML = tag + hanBig + '<div class="py">' + esc(c.p) + '</div>';
    }
    var card = $("card");
    if (noanim) card.classList.add("noanim");
    card.classList.remove("flip"); flipped = false;
    if (noanim) { void card.offsetWidth; card.classList.remove("noanim"); }
    $("sPos").textContent = (i + 1) + " / " + deck.length;
  }
  function next(){ i++; draw(true); }
  $("card").onclick = function(){
    flipped = !flipped; $("card").classList.toggle("flip", flipped);
    if (flipped && S.dir === "en") say();
  };
  $("knowBtn").onclick = function(){ if (i < deck.length) { S.known[deck[i].id] = true; save(); next(); } };
  $("learnBtn").onclick = function(){
    if (i < deck.length) { var c = deck[i]; delete S.known[c.id]; save(); if (missed.indexOf(c) < 0) missed.push(c); next(); }
  };
  $("skipBtn").onclick = function(){ if (i < deck.length) next(); };
  $("prevBtn").onclick = function(){ if (i > 0) { i--; draw(true); } };
  $("optDir").onclick = function(){ S.dir = S.dir === "zh" ? "en" : "zh"; save(); draw(true); };
  $("optShuf").onclick = function(){ shuffled = !shuffled; rebuild(); draw(true); };
  $("optKnown").onclick = function(){ S.hideKnown = !S.hideKnown; save(); rebuild(); draw(true); };
  $("backBtn").onclick = function(){ renderHome(); show("home"); };
  $("homeBtn").onclick = function(){ renderHome(); show("home"); };

  function finish(){
    $("dTitle").textContent = "Round done";
    $("dSub").textContent = missed.length ? missed.length + " card" + (missed.length === 1 ? "" : "s") + " still learning from this round." : "You knew every card this round.";
    $("againBtn").hidden = !missed.length;
    show("done");
  }
  $("againBtn").onclick = function(){
    var m = missed.slice(); start(m, title, subtitle + " · retry", true);
    if (!deck.length) { S.hideKnown = false; rebuild(); draw(true); }
  };

  // ---- list view ----
  var lPool = [], lFrom = "home", lFilter = "all", lHideE = false, lTitle = "", lSub = "", lOpen = {};
  function openList(cards, t, st, from){
    lPool = cards; lTitle = t; lSub = st; lFrom = from; lFilter = "all";
    show("list"); drawList();
  }
  function listSum(){
    var k = lPool.filter(function(c){ return S.known[c.id]; }).length;
    $("lSum").textContent = lPool.length + " words · " + k + " known · " + (lPool.length - k) + " still learning";
  }
  function drawList(){
    $("lTitle").innerHTML = esc(lTitle) + "<small>" + esc(lSub) + "</small>";
    Array.prototype.forEach.call(document.querySelectorAll("#list [data-f]"), function(b){ b.classList.toggle("on", b.dataset.f === lFilter); });
    $("optHideE").classList.toggle("on", lHideE);
    $("lBody").classList.toggle("hideE", lHideE);
    listSum();
    var cards = lPool.filter(function(c){ return lFilter === "all" || (lFilter === "known") === !!S.known[c.id]; });
    if (!cards.length) { $("lBody").innerHTML = '<div class="lst-empty">' + (lFilter === "known" ? "Nothing marked known here yet." : "Nothing left to learn here. 好！") + '</div>'; return; }
    var multi = cards.some(function(c){ return c.deck !== cards[0].deck; }), html = "", cur = null, wk = null;
    $("lTools").hidden = !multi;
    if (multi) {
      var allOpen = DATA.decks.every(function(d){ return lOpen[d.id]; });
      $("lToggleAll").textContent = allOpen ? "Collapse all" : "Expand all";
    }
    cards.forEach(function(c){
      if (c.deck !== cur) {
        if (cur) html += '</div>';
        cur = c.deck;
        if (multi) {
          if (cur.week !== wk) { wk = cur.week; var w = DATA.weeks[wk-1]; html += '<div class="lst-wk">' + esc(w.badge) + ' · ' + esc(w.title) + '</div>'; }
          var inSec = cards.filter(function(x){ return x.deck === cur; });
          var kn = cur.cards.filter(function(x){ return S.known[x.id]; }).length;
          var open = !!lOpen[cur.id];
          html += '<button class="lst-sec' + (open ? ' open' : '') + '" data-sec="' + cur.id + '"><span class="sn">' + esc(cur.name) +
            '<small>' + (lFilter === "all" ? kn + ' / ' + cur.cards.length + ' known' : inSec.length + ' word' + (inSec.length === 1 ? '' : 's')) + '</small></span><span class="ar">›</span></button>';
          html += '<div class="rows"' + (open ? '' : ' hidden') + '>';
        } else html += '<div class="rows">';
      }
      html += '<div class="row' + (S.known[c.id] ? ' kn' : '') + '" data-id="' + esc(c.id) + '">' +
        '<button class="txt"><span class="rh">' + esc(c.h) + '</span><span class="rp">' + esc(c.p) + '</span><span class="re">' + esc(c.e) + '</span></button>' +
        '<button class="chk" aria-label="Mark known"><i>✓</i></button></div>';
    });
    $("lBody").innerHTML = html + '</div>';
  }
  var BYID = {}; ALL.forEach(function(c){ BYID[c.id] = c; });
  $("lBody").addEventListener("click", function(e){
    var sec = e.target.closest("[data-sec]");
    if (sec) { lOpen[sec.dataset.sec] = !lOpen[sec.dataset.sec]; var y = sec.getBoundingClientRect().top; drawList(); var n = document.querySelector('[data-sec="' + sec.dataset.sec + '"]'); window.scrollBy(0, n.getBoundingClientRect().top - y); return; }
    var row = e.target.closest(".row"); if (!row) return;
    var c = BYID[row.dataset.id];
    if (e.target.closest(".chk")) {          // toggle known; row stays put until the filter changes
      if (S.known[c.id]) delete S.known[c.id]; else S.known[c.id] = true;
      save(); row.classList.toggle("kn", !!S.known[c.id]); listSum();
      var h = row.parentNode.previousElementSibling;
      if (h && h.dataset.sec && lFilter === "all") { var d = c.deck; h.querySelector("small").textContent = d.cards.filter(function(x){ return S.known[x.id]; }).length + " / " + d.cards.length + " known"; }
    } else if (lHideE && !row.classList.contains("peek")) {
      row.classList.add("peek");
    } else {
      speak(c.h);
    }
  });
  Array.prototype.forEach.call(document.querySelectorAll("#list [data-f]"), function(b){
    b.onclick = function(){ lFilter = b.dataset.f; drawList(); };
  });
  $("lToggleAll").onclick = function(){
    var allOpen = DATA.decks.every(function(d){ return lOpen[d.id]; });
    DATA.decks.forEach(function(d){ lOpen[d.id] = !allOpen; }); drawList();
  };
  $("optHideE").onclick = function(){ lHideE = !lHideE; drawList(); };
  $("lBack").onclick = function(){
    if (lFrom === "study") { rebuild(); show("study"); draw(true); } else { renderHome(); show("home"); }
  };
  $("scanAll").onclick = function(){ openList(ALL, "All vocab", "Tap ✓ to mark known", "home"); };
  $("optList").onclick = function(){ openList(pool, title, subtitle, "study"); };

  // ---- speech (uses the phone's built-in Chinese voice; works offline if installed) ----
  var zhVoice = null;
  function pickVoice(){
    if (!window.speechSynthesis) return;
    var v = speechSynthesis.getVoices();
    zhVoice = v.filter(function(x){ return /^zh[-_]CN/i.test(x.lang); })[0] || v.filter(function(x){ return /^zh/i.test(x.lang); })[0] || null;
  }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } else { $("sayBtn").hidden = true; }
  function say(){
    if (i < deck.length) speak(deck[i].h);
  }
  function speak(h){
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(h.replace(/\(.*?\)/g, ""));
    u.lang = "zh-CN"; if (zhVoice) u.voice = zhVoice; u.rate = .85;
    speechSynthesis.speak(u);
  }
  $("sayBtn").onclick = say;

  // ---- reset (two taps, no confirm dialog) ----
  var armed = null;
  $("resetBtn").onclick = function(){
    var b = $("resetBtn");
    if (!armed) { b.textContent = "Tap again to erase all progress"; armed = setTimeout(function(){ armed = null; b.textContent = "Reset progress"; }, 3000); return; }
    clearTimeout(armed); armed = null; S.known = {}; S.seeded = true; save(); b.textContent = "Reset progress"; renderHome();
  };

  renderHome();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
